name: Release

# Triggered by the release tag. One tag, three destinations: the GitHub release,
# the apt repository on GitHub Pages, COPR for dnf. If one step fails nothing is
# published — a broken package in a repository costs more than a release that did
# not happen. Rationale: docs/PLAN-PACKAGING.md, ADR-088.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the two jobs that publish (gh-pages, the release)
# raise it to contents: write for themselves.
permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The version lives in two files and the manual page carries it too.
          # pyproject.toml is what the packages are built from, __version__ is
          # what the program reports about itself -- a release where the two
          # disagree ships a package that lies about its own version.
          code="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/maildigest/__init__.py | head -1)"
          if [ "$code" != "$version" ]; then
            echo "pyproject.toml ($version) and __version__ ($code) disagree" >&2
            exit 1
          fi
          if ! grep -q "MailDigest $version" man/maildigest.1; then
            echo "man/maildigest.1 is not for $version -- regenerate with: maildigest --man > man/maildigest.1" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml ($version)" >&2
            exit 1
          fi
          echo "MailDigest $version"

  python:
    name: sdist and wheel
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/*

  deb:
    name: Build the .deb
    needs: version
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Build tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-hatchling devscripts git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: bash packaging/deb/build.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: dist/deb/*.deb

  install-test:
    name: Install test ${{ matrix.image }}
    needs: [version, deb]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "debian:trixie"
            optional: false
          - image: "kalilinux/kali-rolling"
            optional: true
          # 26.04 LTS is the first usable Ubuntu: 22.04 and 24.04 carry pydantic
          # 1.x and imap-tools 0.5x, and 25.04 dropped python3-imap-tools
          # entirely. The versioned Depends make apt refuse the installation
          # there rather than create one that cannot start.
          - image: "ubuntu:26.04"
            optional: true
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
      - name: Install and run
        run: |
          set -eux
          apt-get update
          # The leading ./ is deliberate: that is what makes apt resolve the
          # dependencies of the local file from the distribution.
          apt-get install -y ./maildigest_*.deb
          maildigest --help > /dev/null
          maildigest --man | head -5
          # The package has to ship the manual page -- that is a property of the
          # package, so it is read out of the .deb. On disk it is a different
          # question: container images routinely strip /usr/share/man on unpack
          # (Ubuntu's does, Debian's does not), and that says nothing about the
          # package. Testing the file directly failed on Ubuntu for that reason
          # alone, while everything about the installation was sound.
          dpkg-deb -c ./maildigest_*.deb | grep -q 'usr/share/man/man1/maildigest\.1\.gz'
          if ! grep -rqs 'path-exclude.*/usr/share/man' /etc/dpkg/dpkg.cfg.d/; then
            test -f /usr/share/man/man1/maildigest.1.gz
          fi
          python3 -m maildigest --help > /dev/null
          # Every runtime dependency, not just the ones that are imported at
          # start-up: pdfminer is loaded lazily inside a subprocess, so a
          # missing Depends on it stays invisible until a user gets a PDF.
          python3 -c "import imap_tools, httpx, pydantic, bs4, lxml, pdfminer.high_level" 

  apt-repo:
    name: Publish the apt repository
    needs: [version, deb, install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only one run may write to gh-pages at a time. Two runs at once (a tag and
    # a manual dispatch, say) both check the branch out, both add their package
    # to the pool and both push -- the second push is rejected, and the run that
    # built a perfectly good package fails at the last step. Builds and install
    # tests still run in parallel; only publishing queues. cancel-in-progress
    # stays off: a queued publish must wait, never be dropped.
    concurrency:
      group: apt-repo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
          path: dist/deb
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Import the signing key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${KEY:-}" ]; then
            echo "secret APT_GPG_PRIVATE_KEY missing — nothing is published unsigned." >&2
            exit 1
          fi
          printf '%s' "$KEY" | gpg --batch --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          echo "KEYID=$keyid" >> "$GITHUB_ENV"
      - name: Check out gh-pages
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git worktree add ../pages gh-pages
          else
            git worktree add --detach ../pages
            git -C ../pages checkout --orphan gh-pages
            git -C ../pages rm -rf --quiet . || true
          fi
      - name: File in and sign
        run: |
          set -eux
          mkdir -p ../pages/apt
          bash packaging/deb/publish.sh ../pages/apt dist/deb/maildigest_*.deb "$KEYID"
          # The published key comes from the same key pair as the signature —
          # the two cannot drift apart.
          gpg --export "$KEYID" > ../pages/apt/maildigest-archive-keyring.gpg
          touch ../pages/.nojekyll
          sed -e "s/@VERSION@/${{ needs.version.outputs.version }}/g" \
              packaging/deb/index.html.in > ../pages/index.html
      - name: Publish
        run: |
          set -eux
          cd ../pages
          git add -A
          git commit -m "Apt repository: MailDigest ${{ needs.version.outputs.version }}" || {
            echo "nothing to publish"; exit 0; }
          git push origin gh-pages

  copr:
    name: Trigger COPR (dnf)
    needs: [version, install-test]
    runs-on: ubuntu-latest
    steps:
      - name: Call the webhook
        env:
          HOOK: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          set -eu
          if [ -z "${HOOK:-}" ]; then
            echo "secret COPR_WEBHOOK_URL missing — dnf delivery skipped."
            exit 0
          fi
          # GitHub's secret field is a textarea, so a pasted URL almost always
          # carries a trailing newline. curl then rejects the whole thing with
          # "Malformed input to a URL function" and the release fails on a
          # stray byte nobody can see. Strip every whitespace character and
          # check what is left actually looks like the webhook URL.
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]')"
          case "$HOOK" in
            *"<"*|*">"*)
              echo "COPR_WEBHOOK_URL still contains a placeholder such as <PACKAGE_NAME>." >&2
              exit 1
              ;;
            https://copr.fedorainfracloud.org/webhooks/custom/*) ;;
            *)
              echo "COPR_WEBHOOK_URL is not a COPR *custom* webhook URL (the GitHub one expects a GitHub payload)." >&2
              exit 1
              ;;
          esac
          curl -fsSL -X POST "$HOOK" -o /dev/null
          echo "COPR build triggered."

  github-release:
    name: GitHub release
    needs: [version, python, deb, install-test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
      # Deliberately the preinstalled gh rather than a third-party action: a
      # release run that signs and publishes should depend on as little foreign
      # code as possible.
      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The notes are the CHANGELOG section for this version, not
          # --generate-notes: that lists commit subjects, which say what changed
          # in the repository, while the CHANGELOG says what changed for the
          # person installing it. Installation comes first -- a release page is
          # where people arrive who do not have the program yet.
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "# Debian 13+, Kali, Ubuntu 26.04+"
            echo "curl -fsSL https://kpafi.github.io/maildigest/apt/maildigest-archive-keyring.gpg | sudo tee /usr/share/keyrings/maildigest-archive-keyring.gpg > /dev/null"
            echo "echo \"deb [signed-by=/usr/share/keyrings/maildigest-archive-keyring.gpg] https://kpafi.github.io/maildigest/apt stable main\" | sudo tee /etc/apt/sources.list.d/maildigest.list"
            echo "sudo apt update && sudo apt install maildigest"
            echo
            echo "# Fedora 43+"
            echo "sudo dnf copr enable kpafi/maildigest && sudo dnf install maildigest"
            echo
            echo "# anything else"
            echo "pipx install git+https://github.com/kpafi/maildigest"
            echo '```'
            echo
            echo "The attached .deb is the same package the repository serves; the wheel and"
            echo "sdist are for pip and pipx."
            echo
            # The section for this version, up to the next "## [" heading.
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {inside=1; print "## Changes in " v; next}
              inside && /^## \[/ {exit}
              inside {print}
            ' CHANGELOG.md
          } > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          grep -q "Changes in $VERSION" /tmp/release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release create "$GITHUB_REF_NAME" \
            --title "MailDigest ${{ needs.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            assets/python-dist/* assets/deb/*.deb
