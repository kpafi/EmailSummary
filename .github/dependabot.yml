# Dependabot keeps the pinned GitHub Actions and the Python dependencies current by
# opening pull requests; CI runs on each of them. Weekly, grouped, so it is one PR a week
# per ecosystem at most rather than one per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
